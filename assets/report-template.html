<!doctype html>
<html lang="@@LANG@@" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="@@CSP@@">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>
:root {
  --bg: #fbfbfa; --fg: #1b1f24; --muted: #5b6470; --card: #ffffff; --border: #d8dce1;
  --accent: #2457d6; --code-bg: #f0f2f5;
  --good-fg: #1a7f45; --good-bg: #e6f5ec; --imp-fg: #8a5a00; --imp-bg: #fff3d6;
  --bad-fg: #b42318; --bad-bg: #fde8e6; --dep-fg: #5b3fb4; --dep-bg: #efeafc;
  --warn-bg: #fff3d6; --warn-fg: #6b4500;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --fg: #e6e9ee; --muted: #9aa4b2; --card: #171c23; --border: #2a323d;
    --accent: #7ba4ff; --code-bg: #202731;
    --good-fg: #5fd08a; --good-bg: #12301f; --imp-fg: #f0c35a; --imp-bg: #3a2c08;
    --bad-fg: #ff8a80; --bad-bg: #3d1511; --dep-fg: #b9a4ff; --dep-bg: #2a2146;
    --warn-bg: #3a2c08; --warn-fg: #f0c35a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --fg: #e6e9ee; --muted: #9aa4b2; --card: #171c23; --border: #2a323d;
  --accent: #7ba4ff; --code-bg: #202731;
  --good-fg: #5fd08a; --good-bg: #12301f; --imp-fg: #f0c35a; --imp-bg: #3a2c08;
  --bad-fg: #ff8a80; --bad-bg: #3d1511; --dep-fg: #b9a4ff; --dep-bg: #2a2146;
  --warn-bg: #3a2c08; --warn-fg: #f0c35a;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1rem; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.1em 0.4em; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--code-bg); padding: 0.6rem 0.8rem; border-radius: 6px; overflow-x: auto; margin: 0.4rem 0; white-space: pre-wrap; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 2rem; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
nav.toc { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 1.2rem 0; }
nav.toc ul { list-style: none; margin: 0; padding: 0; }
nav.toc a { display: block; padding: 0.3rem 0.6rem; border-radius: 6px; color: var(--muted); text-decoration: none; border-left: 3px solid transparent; }
nav.toc a:hover { color: var(--fg); }
nav.toc a.active { color: var(--fg); border-left-color: var(--accent); background: var(--code-bg); }
nav.toc .brand { font-weight: 700; padding: 0 0.6rem 0.8rem; }
main { padding: 1.5rem 0 4rem; min-width: 0; }
section { margin-bottom: 3rem; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.4rem; }
h2 { font-size: 1.35rem; margin: 0 0 1rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.08rem; margin: 1.2rem 0 0.5rem; }
.muted { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1.2rem; color: var(--muted); font-size: 0.92rem; margin-bottom: 1rem; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; margin: 0.8rem 0; }
.banner { border-radius: 10px; padding: 0.8rem 1rem; margin: 1rem 0; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--border); }
.badge { display: inline-flex; align-items: center; gap: 0.3em; padding: 0.1em 0.6em; border-radius: 999px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.v-good { background: var(--good-bg); color: var(--good-fg); }
.v-improvable { background: var(--imp-bg); color: var(--imp-fg); }
.v-bad { background: var(--bad-bg); color: var(--bad-fg); }
.v-depends { background: var(--dep-bg); color: var(--dep-fg); }
.w-badge, .c-badge { background: var(--code-bg); color: var(--muted); }
.finding { border-left: 4px solid var(--border); }
.finding[data-verdict="good"] { border-left-color: var(--good-fg); }
.finding[data-verdict="improvable"] { border-left-color: var(--imp-fg); }
.finding[data-verdict="bad"] { border-left-color: var(--bad-fg); }
.finding[data-verdict="depends"] { border-left-color: var(--dep-fg); }
.finding header { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; }
.finding h3 { margin: 0; flex: 1 1 14rem; }
.field { margin: 0.5rem 0; }
.field > b { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.evidence { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.3rem 0; list-style: none; padding: 0; }
.ev { display: block; }
.ev .ref { font-weight: 600; }
.ev.unverified .ref::after { content: " ?"; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; list-style: none; padding: 0; margin: 0.4rem 0; }
.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; }
.filters button, .theme-btn {
  font: inherit; font-size: 0.85rem; padding: 0.25rem 0.8rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--fg);
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.theme-btn { position: fixed; top: 0.8rem; right: 0.8rem; z-index: 5; }
.finding[hidden] { display: none; }
footer { border-top: 1px solid var(--border); padding: 1.5rem 0 3rem; color: var(--muted); font-size: 0.88rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 860px) {
  .layout { display: block; }
  nav.toc { position: static; max-height: none; padding: 1rem 0 0; }
  nav.toc ul { display: flex; gap: 0.3rem; overflow-x: auto; padding-bottom: 0.5rem; }
  nav.toc a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
  nav.toc a.active { border-bottom-color: var(--accent); }
  h1 { font-size: 1.5rem; }
}
@media print {
  nav.toc, .theme-btn, .filters { display: none; }
  .layout { display: block; }
  .finding[hidden] { display: block; }
}
</style>
</head>
<body>
<button class="theme-btn" id="theme-btn" type="button" data-label-auto="@@THEME_AUTO@@" data-label-light="@@THEME_LIGHT@@" data-label-dark="@@THEME_DARK@@">@@THEME_AUTO@@</button>
<div class="layout">
<nav class="toc" aria-label="@@NAV_LABEL@@">
<div class="brand">code-teardown</div>
<ul>
@@NAV@@
</ul>
</nav>
<main>
@@BODY@@
<footer>
@@FOOTER@@
</footer>
</main>
</div>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-btn");
  var modes = ["auto", "light", "dark"];
  function setMode(mode) {
    root.setAttribute("data-theme", mode);
    btn.textContent = btn.getAttribute("data-label-" + mode);
    try { localStorage.setItem("ct-theme", mode); } catch (e) {}
  }
  try {
    var saved = localStorage.getItem("ct-theme");
    if (modes.indexOf(saved) > -1) setMode(saved);
  } catch (e) {}
  btn.addEventListener("click", function () {
    var next = modes[(modes.indexOf(root.getAttribute("data-theme")) + 1) % modes.length];
    setMode(next);
  });

  var buttons = document.querySelectorAll(".filters button");
  var findings = document.querySelectorAll(".finding");
  var active = {};
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.getAttribute("data-filter");
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) active[v] = true; else delete active[v];
      var any = Object.keys(active).length > 0;
      findings.forEach(function (f) {
        f.hidden = any && !active[f.getAttribute("data-verdict")];
      });
    });
  });

  var links = document.querySelectorAll("nav.toc a");
  if ("IntersectionObserver" in window) {
    var map = {};
    links.forEach(function (a) { map[a.getAttribute("href").slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting && map[en.target.id]) {
          links.forEach(function (a) { a.classList.remove("active"); });
          map[en.target.id].classList.add("active");
        }
      });
    }, { rootMargin: "0px 0px -70% 0px" });
    document.querySelectorAll("main section[id]").forEach(function (s) { io.observe(s); });
  }
})();
</script>
</body>
</html>
